<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SearchDeck</title>
  <link rel="stylesheet" href="../src/ui.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../src/theme.js"></script>
</head>
<body>
  <form id="form" autocomplete="off">
    <header>
      <h1>SearchDeck</h1>
      <select id="deck" aria-label="Active deck"></select>
      <button type="button" id="settings" class="icon-btn" aria-label="Settings" title="Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M2 4h5M11 4h3M2 8h1M7 8h7M2 12h7M13 12h1"/>
          <circle cx="9" cy="4" r="1.8"/><circle cx="5" cy="8" r="1.8"/><circle cx="11" cy="12" r="1.8"/>
        </svg>
      </button>
    </header>

    <input id="query" type="search" placeholder="Search term, then Enter" aria-label="Search term" spellcheck="false" autofocus>

    <div class="list-head">
      <label><input type="checkbox" id="all"> <span>Select all</span></label>
      <span id="count" class="muted"></span>
    </div>
    <ul id="destinations"></ul>

    <p id="status" class="error" role="status" aria-live="polite"></p>
    <button type="submit" id="open" class="primary">Open Tabs</button>
  </form>
  <script type="module" src="popup.js"></script>
</body>
</html>
